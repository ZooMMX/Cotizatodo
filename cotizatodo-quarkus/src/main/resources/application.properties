# ============================================================
# Cotizatodo (Quarkus)
# ============================================================

# ---- Datasource: configurable por entorno (MySQL por defecto, Postgres opcional) ----
# Para PostgreSQL basta con DB_KIND=postgresql y el DB_URL correspondiente.
quarkus.datasource.db-kind=${DB_KIND:mysql}
quarkus.datasource.username=${DB_USER:cotizatodo}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost/cotizatodo}

# ---- Puerto HTTP: respeta el $PORT que inyectan varios PaaS (Railway, etc.) ----
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Igual que spring.jpa.hibernate.ddl-auto=update
quarkus.hibernate-orm.database.generation=update
# Equivalente Hibernate 6 del ImprovedNamingStrategy legado (camelCase -> snake_case)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ---- Dev/Test: H2 en memoria + usuario semilla (DevStartup) ----
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:cotizatodo;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:cotizatodo-test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# ---- Autenticación con formulario (reemplaza a Spring Security formLogin) ----
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error
quarkus.http.auth.form.landing-page=/quotes
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.cookie-name=quarkus-credential
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT1M

# Clave de cifrado de la cookie de sesión: SIEMPRE sobreescribir en prod
# (variable de entorno COOKIE_ENCRYPTION_KEY)
quarkus.http.auth.session.encryption-key=${COOKIE_ENCRYPTION_KEY:dev-only-change-me-0123456789abcdef}

# SameSite en la cookie de sesión: mitiga CSRF en los POST de formularios
quarkus.http.same-site-cookie.quarkus-credential.value=lax

# ---- Autorización por rutas (equivalente al WebSecurityConfig legado) ----
quarkus.http.auth.permission.public.paths=/,/login,/register,/usuarioCheckUsername,/quotes/new,/quotes/print,/quotes/print/pdf,/error,/403,/favicon.ico,/img/*,/css/*,/media/*,/plugins/*,/scripts/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.policy.role-admin.roles-allowed=ROLE_ADMIN
quarkus.http.auth.permission.admin.paths=/admin/*
quarkus.http.auth.permission.admin.policy=role-admin

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ---- Subida de archivos (logo): mismo límite de 2MB que la app legada ----
quarkus.http.limits.max-form-attribute-size=2M
quarkus.http.limits.max-body-size=4M

# ---- Codificación ----
quarkus.default-locale=en
quarkus.locales=en,es
